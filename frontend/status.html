<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Booking Status - RUBIX Panel Scheduler</title>
    <link rel="stylesheet" href="/static/css/theme.css">
    <style>
        .status-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .status-hero {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: white;
            padding: 4rem 2rem;
            text-align: center;
        }
        
        .status-hero h1 {
            color: white;
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }
        
        .status-hero p {
            color: rgba(255, 255, 255, 0.85);
            font-size: 1rem;
        }
        
        .status-card {
            background: white;
            border-radius: 16px;
            padding: 2.5rem;
            max-width: 500px;
            margin: -3rem auto 2rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            position: relative;
            z-index: 10;
        }
        
        .status-result {
            margin-top: 2rem;
        }
        
        .booking-item {
            background: #f8fafc;
            border-radius: 12px;
            padding: 1.25rem;
            margin-bottom: 1rem;
            border: 1px solid #e2e8f0;
        }
        
        .booking-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }
        
        .booking-company {
            font-weight: 600;
            font-size: 1rem;
            color: #1e293b;
        }
        
        .booking-meta {
            display: flex;
            gap: 1rem;
            font-size: 0.875rem;
            color: #64748b;
            margin-bottom: 0.5rem;
        }
        
        .booking-meta-item {
            display: flex;
            align-items: center;
            gap: 0.375rem;
        }
        
        .no-bookings {
            text-align: center;
            padding: 3rem;
            color: #94a3b8;
        }
        
        .no-bookings svg {
            margin-bottom: 1rem;
            opacity: 0.5;
        }
        
        .nav-bar {
            background: white;
            border-bottom: 1px solid #e2e8f0;
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .nav-brand {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 700;
            color: #1e293b;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="status-container">
        <nav class="nav-bar">
            <a href="/" class="nav-brand">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="16" y1="2" x2="16" y2="6"></line>
                    <line x1="8" y1="2" x2="8" y2="6"></line>
                    <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
                RUBIX Panel Scheduler
            </a>
            <a href="/booking" class="btn btn-primary btn-sm">Book Interview</a>
        </nav>
        
        <div class="status-hero">
            <h1>Check Your Booking Status</h1>
            <p>Enter your student ID to view your interview bookings</p>
        </div>
        
        <div class="status-card">
            <div class="form-group">
                <label class="form-label required">Student ID</label>
                <input type="text" class="form-control" id="studentIdInput" placeholder="Enter your student ID" autofocus>
            </div>
            
            <div class="form-group">
                <label class="form-label">Booking ID (Optional)</label>
                <input type="text" class="form-control" id="bookingIdInput" placeholder="Enter specific booking ID">
                <div class="form-text">Leave blank to see all bookings</div>
            </div>
            
            <button class="btn btn-primary btn-block btn-lg" onclick="checkStatus()" id="checkBtn">
                Check Status
            </button>
            
            <div class="status-result" id="statusResult" style="display: none;">
                <hr style="margin: 1.5rem 0; border: none; border-top: 1px solid #e2e8f0;">
                <h4 style="margin-bottom: 1rem;">Your Bookings</h4>
                <div id="bookingsList"></div>
            </div>
        </div>
    </div>
    
    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner" style="width: 40px; height: 40px;"></div>
    </div>
    
    <!-- Alert Container -->
    <div id="alertContainer" style="position: fixed; top: 20px; right: 20px; z-index: 1000;"></div>
    
    <script>
        function showAlert(message, type = 'info') {
            const container = document.getElementById('alertContainer');
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.innerHTML = `<span>${message}</span>`;
            container.appendChild(alert);
            setTimeout(() => alert.remove(), 5000);
        }
        
        function showLoading() {
            document.getElementById('loadingOverlay').classList.add('active');
        }
        
        function hideLoading() {
            document.getElementById('loadingOverlay').classList.remove('active');
        }
        
        async function checkStatus() {
            const studentId = document.getElementById('studentIdInput').value.trim();
            const bookingId = document.getElementById('bookingIdInput').value.trim();
            
            if (!studentId) {
                showAlert('Please enter your student ID', 'danger');
                return;
            }
            
            showLoading();
            
            try {
                const response = await fetch('/api/status/check', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        student_id: studentId,
                        booking_id: bookingId || null
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    displayResults(data);
                } else {
                    showAlert(data.message || 'Student not found', 'danger');
                    document.getElementById('statusResult').style.display = 'none';
                }
            } catch (error) {
                showAlert('Failed to check status. Please try again.', 'danger');
                console.error('Error:', error);
            } finally {
                hideLoading();
            }
        }
        
        function displayResults(data) {
            const resultDiv = document.getElementById('statusResult');
            const listDiv = document.getElementById('bookingsList');
            
            resultDiv.style.display = 'block';
            
            if (data.bookings && data.bookings.length > 0) {
                listDiv.innerHTML = data.bookings.map(booking => `
                    <div class="booking-item">
                        <div class="booking-item-header">
                            <span class="booking-company">${booking.Company || 'N/A'}</span>
                            <span class="badge status-${getStatusClass(booking.Status)}">${booking.Status || 'BOOKED'}</span>
                        </div>
                        <div class="booking-meta">
                            <div class="booking-meta-item">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                                    <line x1="16" y1="2" x2="16" y2="6"></line>
                                    <line x1="8" y1="2" x2="8" y2="6"></line>
                                    <line x1="3" y1="10" x2="21" y2="10"></line>
                                </svg>
                                ${formatDate(booking.InterviewDate)}
                            </div>
                            <div class="booking-meta-item">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <circle cx="12" cy="12" r="10"></circle>
                                    <polyline points="12 6 12 12 16 14"></polyline>
                                </svg>
                                ${booking.StartTime} - ${booking.EndTime}
                            </div>
                        </div>
                        <div class="booking-meta">
                            <div class="booking-meta-item">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                    <circle cx="12" cy="7" r="4"></circle>
                                </svg>
                                Panel: ${booking.AllocatedPanel || 'N/A'}
                            </div>
                            <div class="booking-meta-item">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <circle cx="12" cy="12" r="10"></circle>
                                    <line x1="12" y1="8" x2="12" y2="12"></line>
                                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                                </svg>
                                ${booking.Duration} min
                            </div>
                        </div>
                        ${booking.Notes ? `<p style="font-size: 0.75rem; color: #64748b; margin-top: 0.5rem;">${booking.Notes}</p>` : ''}
                    </div>
                `).join('');
            } else {
                listDiv.innerHTML = `
                    <div class="no-bookings">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                            <line x1="16" y1="2" x2="16" y2="6"></line>
                            <line x1="8" y1="2" x2="8" y2="6"></line>
                            <line x1="3" y1="10" x2="21" y2="10"></line>
                            <line x1="9" y1="14" x2="15" y2="14"></line>
                        </svg>
                        <p>No bookings found</p>
                    </div>
                `;
            }
        }
        
        function getStatusClass(status) {
            const classes = {
                'BOOKED': 'success',
                'WAITLISTED': 'warning',
                'CANCELLED': 'danger',
                'COMPLETED': 'primary',
                'NO_SHOW': 'secondary',
                'RESCHEDULED': 'info'
            };
            return classes[status] || 'secondary';
        }
        
        function formatDate(dateStr) {
            if (!dateStr) return 'N/A';
            const date = new Date(dateStr + 'T00:00:00');
            return date.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
        }
        
        // Enter key support
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('studentIdInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') checkStatus();
            });
            document.getElementById('bookingIdInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') checkStatus();
            });
        });
    </script>
</body>
</html>
